[project]
name = "ladon-mimir"
version = "0.2.0"
description = "Async Wikipedia adapter for Ladon — mathematical finance corpus for LLM fine-tuning."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Alessio Pascucci", email = "feeder81@gmail.com"},
]
keywords = ["web-crawler", "wikipedia", "python", "llm", "data-pipeline", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "ladon-crawl>=0.3.1",
    "duckdb>=0.10",
    "click>=8.0",
    "pytz>=2023.3",
]

[project.entry-points."ladon.mcp"]
mimir = "ladon_mimir.mcp:MimirMCPAdapter"

[project.scripts]
ladon-mimir = "ladon_mimir.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "pytest-httpx>=0.30",
    "pre-commit",
    "pyright>=1.1",
    "black",
    "ruff",
    "isort",
]

[project.urls]
Homepage = "https://github.com/MoonyFringers/ladon-mimir"
Repository = "https://github.com/MoonyFringers/ladon-mimir"
Issues = "https://github.com/MoonyFringers/ladon-mimir/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ladon_mimir = ["py.typed"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

# ----------------------------------------
# BLACK
# ----------------------------------------
[tool.black]
line-length = 80
target-version = ['py311', 'py312', 'py313']

# ----------------------------------------
# ISORT
# ----------------------------------------
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 80

# ----------------------------------------
# RUFF
# ----------------------------------------
[tool.ruff]
line-length = 80
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # Handled by Black
]

# ----------------------------------------
# PYRIGHT
# ----------------------------------------
[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
reportMissingImports = "none"
reportUntypedFunctionDecorator = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportPrivateUsage = "none"
reportUnusedFunction = "none"

# ----------------------------------------
# PYTEST
# ----------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

# ----------------------------------------
# COVERAGE
# ----------------------------------------
[tool.coverage.run]
source = ["ladon_mimir"]
